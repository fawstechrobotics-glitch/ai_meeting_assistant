# ==============================================================================
# Assistive Real-Time Meeting Tool - Docker Compose for macOS
# ==============================================================================
# Optimized for Docker Desktop on macOS. Streams live video, HUD overlay,
# STT subtitles, and ISL/ASL gesture recognition directly to your web browser
# at http://localhost:5000. Bypasses X11 and Linux V4L2 driver limitations.
# ==============================================================================

services:
  meeting-tool:
    build:
      context: .
      dockerfile: Dockerfile
    image: assistive-meeting-tool:latest
    container_name: assistive_meeting_assistant_mac
    restart: unless-stopped
    ports:
      - "5050:5000"
    env_file:
      - path: .env
        required: false
    environment:
      - HEADLESS_MODE=true
      - MOCK_HARDWARE=true
      - ENABLE_WEB_STREAM=true
      - WEB_STREAM_PORT=5000
      - SIGN_LANGUAGE_MODE=ISL
    volumes:
      - ./models:/app/models:ro
      - ./src:/app/src:ro
    stdin_open: true
    tty: true

  test-runner:
    build:
      context: .
      dockerfile: Dockerfile
    image: assistive-meeting-tool:latest
    container_name: assistive_meeting_tests_mac
    entrypoint: ["pytest"]
    command: ["tests/", "-v", "--tb=short"]
    environment:
      - HEADLESS_MODE=true
      - MOCK_HARDWARE=true
    volumes:
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
